name: catalyst-scan

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Override target date (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""
      llm_max:
        description: "Max tickers to LLM-grade (default 50, set 0 to skip)"
        required: false
        default: ""
  repository_dispatch:
    types: [run-catalyst-scan]
  # External cron-job.org POSTs run-catalyst-scan at 02:00 UTC for SLA-
  # reliable timing. GitHub schedule below is fallback only.
  schedule:
    - cron: "0 2 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run catalyst scan
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CATALYST_DATE: ${{ inputs.target_date }}
          CATALYST_LLM_MAX: ${{ inputs.llm_max }}
          SKIP_EMAIL: ${{ github.event_name == 'schedule' && '1' || '' }}
          ACCOUNT_SIZE_USD: ${{ secrets.ACCOUNT_SIZE_USD }}
          POSITION_SIZE_PCT: ${{ secrets.POSITION_SIZE_PCT }}
          STOP_LOSS_PCT: ${{ secrets.STOP_LOSS_PCT }}
          MAX_CONCURRENT_LOTTERY: ${{ secrets.MAX_CONCURRENT_LOTTERY }}
        run: python scripts/run_catalyst_scan.py
      - name: Run universe-wide factor screen
        if: always()
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          CATALYST_DATE: ${{ inputs.target_date }}
        run: python scripts/run_factor_universe_scan.py
      - name: Commit tracker data + scan JSON for email job
        if: always()
        run: |
          git config user.name "catalyst-tracker-bot"
          git config user.email "noreply@github.com"
          git add data/catalyst/predictions/ data/catalyst/history.json data/catalyst/paper_trades.json 2>/dev/null || true
          git add -f data/results/catalyst_*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "tracker: update predictions, history, paper trades, scan JSON [skip ci]"
          git push || true
      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-result
          path: data/results/catalyst_*
