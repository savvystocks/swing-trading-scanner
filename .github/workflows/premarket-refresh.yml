name: premarket-refresh

on:
  workflow_dispatch:
  schedule:
    # 8:55 UTC scheduled. With GitHub Actions 3-6h delay observed on this repo,
    # email lands 12:00-15:00 UTC = 13:00-16:00 user time = mostly pre-US-open
    # to first hour of session. Was 13:00 UTC but that landed 17:00-20:00 mid-session.
    - cron: "55 8 * * 1-5"

permissions:
  actions: read
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download latest scan artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: daily-scan.yml
          name: scan-result
          path: data/results/
          if_no_artifact_found: warn
      - name: Run pre-market refresh
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/run_premarket_refresh.py
