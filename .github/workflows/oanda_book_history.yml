name: oanda-book-history
on:
  workflow_dispatch:
    inputs:
      start:
        description: "YYYY-MM-DD"
        required: false
        default: "2017-01-01"
      end:
        description: "YYYY-MM-DD"
        required: false
        default: "2026-11-25"
      step_min:
        description: "minutes between snapshots"
        required: false
        default: "60"
permissions:
  contents: read
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        pair: [EUR_USD, USD_JPY]
        book: [orderBook, positionBook]
    steps:
      - uses: actions/checkout@v4
      - name: Pull book history (read-only)
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          PAIR: ${{ matrix.pair }}
          BOOK: ${{ matrix.book }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          STEP_MIN: ${{ inputs.step_min }}
          OUT_DIR: books
        run: python3 scripts/oanda_book_history.py
      - uses: actions/upload-artifact@v4
        with:
          name: books_${{ matrix.pair }}_${{ matrix.book }}
          path: books/
          retention-days: 30
