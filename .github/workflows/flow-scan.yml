name: flow-scan

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Override target date (YYYY-MM-DD)"
        required: false
        default: ""
      force_email:
        description: "Force email send even outside email window (1=yes)"
        required: false
        default: ""
  repository_dispatch:
    types: [run-flow-scan]
  schedule:
    # Summer (Mar-Oct, BST/EDT): US market 13:30-20:00 UTC
    # Every 30 min during regular hours - balances freshness vs UW API budget.
    - cron: "30 13 * 3-10 1-5"        # 13:30 UTC (open)
    - cron: "0,30 14-19 * 3-10 1-5"   # 14:00-19:30 every 30 min
    - cron: "0 20 * 3-10 1-5"         # 20:00 UTC (close)
    # Winter (Nov-Mar, GMT/EST): US market 14:30-21:00 UTC
    - cron: "30 14 * 1-2,11-12 1-5"
    - cron: "0,30 15-20 * 1-2,11-12 1-5"
    - cron: "0 21 * 1-2,11-12 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: flow-scan-${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run flow scan
        env:
          UNUSUAL_WHALES_TOKEN: ${{ secrets.UNUSUAL_WHALES_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CATALYST_DATE: ${{ inputs.target_date }}
          FORCE_EMAIL: ${{ inputs.force_email }}
          ACCOUNT_SIZE_GBP: "4000"
          GOAL_TARGET_GBP: "20000"
          GOAL_DEADLINE_ISO: "2026-11-29"
        run: python scripts/run_flow_scan.py
      - name: Commit scan output + state
        if: always()
        run: |
          git config user.name "flow-scan-bot"
          git config user.email "noreply@github.com"
          git add -f data/results/flow_scan_*.json data/results/flow_email_*.html data/flow_state/state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "flow-scan: $(date -u +%Y-%m-%d_%H:%M) [skip ci]"
          git push || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-scan-result-${{ github.run_id }}
          path: data/results/flow_*
