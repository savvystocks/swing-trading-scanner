name: send-telegram

# Runs automatically every time data/telegram_outbox/latest.txt is updated.
# Also triggerable manually with a custom message file.

on:
  push:
    branches: [main]
    paths:
      - 'data/telegram_outbox/latest.txt'
  workflow_dispatch:
    inputs:
      message_file:
        description: 'Path to message file (default data/telegram_outbox/latest.txt)'
        required: false
        default: 'data/telegram_outbox/latest.txt'

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Send message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_telegram_message.py "${{ inputs.message_file || 'data/telegram_outbox/latest.txt' }}"
