name: catalyst-scan

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Override target date (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""
      llm_max:
        description: "Max tickers to LLM-grade (default 50, set 0 to skip)"
        required: false
        default: ""
  # Re-enabled 2026-05-04: VPS options blocked by Alpaca CDN, reverting to GitHub
  # Actions while waiting for whitelist. Accepts 4-6h delay tradeoff.
  schedule:
    - cron: "0 19 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run catalyst scan
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CATALYST_DATE: ${{ inputs.target_date }}
          CATALYST_LLM_MAX: ${{ inputs.llm_max }}
        run: python scripts/run_catalyst_scan.py
      - name: Commit tracker data
        if: always()
        run: |
          git config user.name "catalyst-tracker-bot"
          git config user.email "noreply@github.com"
          git add data/catalyst/predictions/ data/catalyst/history.json data/catalyst/paper_trades.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "tracker: update predictions, history, paper trades [skip ci]"
          git push || true
      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-result
          path: data/results/catalyst_*
