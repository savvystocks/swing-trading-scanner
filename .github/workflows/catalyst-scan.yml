name: catalyst-scan

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Override target date (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""
      llm_max:
        description: "Max tickers to LLM-grade (default 50, set 0 to skip)"
        required: false
        default: ""
  # Two-pass architecture: heavy scan at 02:00 UTC (10pm ET previous evening),
  # saves JSON. Email job (catalyst-email.yml) runs at 13:55 UTC the next day to
  # refresh live prices and send. Decouples scan duration from email timing so
  # GitHub Actions cron delay never holds up the email.
  schedule:
    - cron: "0 2 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run catalyst scan
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CATALYST_DATE: ${{ inputs.target_date }}
          CATALYST_LLM_MAX: ${{ inputs.llm_max }}
          SKIP_EMAIL: "1"
          ACCOUNT_SIZE_USD: ${{ secrets.ACCOUNT_SIZE_USD }}
          POSITION_SIZE_PCT: ${{ secrets.POSITION_SIZE_PCT }}
          STOP_LOSS_PCT: ${{ secrets.STOP_LOSS_PCT }}
          MAX_CONCURRENT_LOTTERY: ${{ secrets.MAX_CONCURRENT_LOTTERY }}
        run: python scripts/run_catalyst_scan.py
      - name: Commit tracker data
        if: always()
        run: |
          git config user.name "catalyst-tracker-bot"
          git config user.email "noreply@github.com"
          git add data/catalyst/predictions/ data/catalyst/history.json data/catalyst/paper_trades.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "tracker: update predictions, history, paper trades [skip ci]"
          git push || true
      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-result
          path: data/results/catalyst_*
