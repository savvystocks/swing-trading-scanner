name: live-scan

on:
  workflow_dispatch:        # external exact-time trigger (cron-job.org) via the GitHub API
  schedule:
    # Failsafe backup only - GitHub's cron queue is delayed, so cron-job.org drives the
    # exact */10 cadence. The 13-21 UTC band covers both DST halves (RTH is 13:30-20:00 UTC
    # summer / 14:30-21:00 UTC winter); the script's _market_is_open() guard trims to session.
    - cron: "*/10 13-21 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    concurrency:
      group: live-scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: UW flow -> adapter -> alert_engine -> Telegram
        env:
          UNUSUAL_WHALES_TOKEN: ${{ secrets.UNUSUAL_WHALES_TOKEN }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNT_SIZE_GBP: "4000"
          EXEC_SIZE_PCT: "25"
          GATE_MIN_POSITIONING_SIGNALS: "1"
        run: python scripts/run_live_scan.py
      - name: Commit scan state
        if: always()
        run: |
          git config user.name "scan-bot"
          git config user.email "noreply@github.com"
          # Separate adds: a missing file (e.g. paper_probe_positions.json on a 0-trade day)
          # must NOT abort staging of the session state (heartbeat / cooldown / regime+breadth cache).
          git add -f data/ambush_logs 2>/dev/null || true
          git add -f data/paper_trades/closed.json 2>/dev/null || true
          git add -f data/paper_trades/paper_probe_positions.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no scan state to commit"; exit 0; fi
          git commit -m "live scan state [skip ci]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && break
            echo "push failed (concurrent commit) - rebasing onto latest main, attempt $i"
            git pull --rebase --autostash origin main || true
            sleep 2
          done
