name: paper-digest

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 1-5"          # 21:30 UTC daily, Mon-Fri (clean post-market wrap)

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    concurrency:
      group: paper-digest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Mark paper positions + send digest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_paper_digest.py
      - name: Commit paper state
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "noreply@github.com"
          git add -f data/paper_trades/closed.json data/paper_trades/paper_probe_positions.json data/ambush_logs 2>/dev/null || true
          git diff --cached --quiet || git commit -m "paper digest state [skip ci]"
          git push || true
