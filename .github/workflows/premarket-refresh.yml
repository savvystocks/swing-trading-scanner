name: premarket-refresh

on:
  workflow_dispatch:
  # Cron disabled: this workflow uses OLD swing-scanner data (daily-scan
  # artifact). User now runs the catalyst system which has its own
  # email pipeline (catalyst-email.yml at 13:55 UTC). The old pre-market
  # refresh email arrived 3-6h late on stale swing-scanner data.
  # schedule:
  #   - cron: "55 8 * * 1-5"

permissions:
  actions: read
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download latest scan artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: daily-scan.yml
          name: scan-result
          path: data/results/
          if_no_artifact_found: warn
      - name: Run pre-market refresh
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/run_premarket_refresh.py
