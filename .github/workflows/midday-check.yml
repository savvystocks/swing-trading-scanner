name: midday-check

on:
  workflow_dispatch:
  # Cron disabled: this workflow uses OLD swing-scanner data (daily-scan
  # artifact). Mid-session email was landing AFTER market close. User
  # now runs the catalyst system; its email at 13:55 UTC arrives at
  # market open with live Alpaca prices. Repurpose this workflow for
  # catalyst mid-session if needed later.
  # schedule:
  #   - cron: "0 14 * * 1-5"

permissions:
  actions: read
  contents: read

jobs:
  midday:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download latest scan artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: daily-scan.yml
          name: scan-result
          path: data/results/
          if_no_artifact_found: warn
      - name: Run mid-session check
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/run_midday_check.py
