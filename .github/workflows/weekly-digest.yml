name: weekly-digest

on:
  workflow_dispatch: {}
  # Every Sunday at 19:00 UTC (8pm BST, 7pm GMT)
  schedule:
    - cron: "0 19 * * 0"

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run weekly digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ACCOUNT_SIZE_GBP: "4000"
          POSITION_SIZE_PCT: "25"
          MAX_CONCURRENT: "2"
          MAX_DRAWDOWN_PCT: "20"
          MAX_LOSS_STREAK: "3"
          GOAL_TARGET_GBP: "20000"
          GOAL_DEADLINE_ISO: "2026-11-29"
        run: python scripts/weekly_digest.py
