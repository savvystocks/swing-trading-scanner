name: catalyst-email

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Scan date to load (YYYY-MM-DD). Leave blank for latest."
        required: false
        default: ""
  repository_dispatch:
    types: [run-catalyst-email]
  schedule:
    # Email at 14:45 UTC = 15:45 BST = 75min after US summer open. Scan runs
    # at 14:00 UTC, finishes ~14:21, factor screen ~14:30. Email picks up
    # fresh JSON + applies opening-action gap boost via Alpaca live quotes.
    - cron: "45 14 * * 1-5"

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check today's scan JSON exists (no auto-rescan to preserve quota)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ -f "data/results/catalyst_${TODAY}.json" ]; then
            echo "Found data/results/catalyst_${TODAY}.json — proceeding to email"
          else
            echo "::warning::No catalyst_${TODAY}.json — scan workflow must have failed. NOT auto-rescanning to preserve EODHD quota."
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "text=Catalyst-email skipped on ${TODAY} — scan JSON missing. Check catalyst-scan workflow logs for failure." || true
            fi
            exit 0
          fi
      - name: Render and send catalyst emails (live Alpaca chain at send-time)
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CATALYST_DATE: ${{ inputs.target_date }}
          ACCOUNT_SIZE_USD: ${{ secrets.ACCOUNT_SIZE_USD }}
          POSITION_SIZE_PCT: ${{ secrets.POSITION_SIZE_PCT }}
          STOP_LOSS_PCT: ${{ secrets.STOP_LOSS_PCT }}
          MAX_CONCURRENT_LOTTERY: ${{ secrets.MAX_CONCURRENT_LOTTERY }}
        run: python scripts/run_catalyst_email.py
      - name: Commit fresh scan + screen JSON
        if: always()
        run: |
          git config user.name "catalyst-email-bot"
          git config user.email "noreply@github.com"
          git add -f data/results/catalyst_*.json data/results/factor_screen_*.json data/catalyst/predictions/ data/catalyst/history.json data/catalyst/paper_trades.json data/universe/factor_universe_mcap_cache.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "email-bot: fresh scan + screen JSON [skip ci]"
          git push || true
      - name: Upload rendered HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-emails
          path: data/results/catalyst_*email*.html
