name: catalyst-scan

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Override target date (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""
      cutoff:
        description: "Score cutoff for email (default 6.0)"
        required: false
        default: ""
  schedule:
    - cron: "0 19 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run catalyst scan
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CATALYST_DATE: ${{ inputs.target_date }}
          CATALYST_CUTOFF: ${{ inputs.cutoff }}
        run: python scripts/run_catalyst_scan.py
      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-result
          path: data/results/catalyst_*
