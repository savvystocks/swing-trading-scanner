name: daily-scan

on:
  workflow_dispatch:
    inputs:
      scan_limit:
        description: "Limit universe size (leave blank for full 3089-ticker scan, or enter a number like 50 for a quick test)"
        required: false
        default: ""
  # Schedule disabled 2026-04-30: VPS cron at 13:38 UTC is now primary scheduler.
  # GitHub Actions free-tier cron was unreliable (4-6h delays). Manual workflow_dispatch
  # still available as fallback. To re-enable scheduled GitHub run, uncomment below:
  # schedule:
  #   - cron: "43 9 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily scan
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SCAN_LIMIT: ${{ inputs.scan_limit }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/run_daily_scan.py
      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-result
          path: data/results/
