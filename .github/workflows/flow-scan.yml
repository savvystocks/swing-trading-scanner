name: flow-scan

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Override target date (YYYY-MM-DD)"
        required: false
        default: ""
  repository_dispatch:
    types: [run-flow-scan]
  # 3 entry windows for the aggressive trader:
  # Morning  14:00 UTC (15:00 BST summer) - pre-market + overnight flow context
  # Midday   17:30 UTC (18:30 BST summer) - new flow that emerged after open
  # Power    20:30 UTC (21:30 BST summer) - late institutional rebalancing
  schedule:
    - cron: "0 14 * 3-10 1-5"
    - cron: "30 17 * 3-10 1-5"
    - cron: "30 20 * 3-10 1-5"
    - cron: "0 15 * 1-2,11-12 1-5"
    - cron: "30 18 * 1-2,11-12 1-5"
    - cron: "30 21 * 1-2,11-12 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run flow scan
        env:
          UNUSUAL_WHALES_TOKEN: ${{ secrets.UNUSUAL_WHALES_TOKEN }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CATALYST_DATE: ${{ inputs.target_date }}
          ACCOUNT_SIZE_GBP: "4000"
          GOAL_TARGET_GBP: "20000"
          GOAL_DEADLINE_ISO: "2026-11-29"
          SKIP_EMAIL: ${{ github.event_name == 'schedule' && '' || '' }}
        run: python scripts/run_flow_scan.py
      - name: Commit scan output
        if: always()
        run: |
          git config user.name "flow-scan-bot"
          git config user.email "noreply@github.com"
          git add -f data/results/flow_scan_*.json data/results/flow_email_*.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "flow-scan: $(date -u +%Y-%m-%d_%H:%M) [skip ci]"
          git push || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-scan-result
          path: data/results/flow_*
