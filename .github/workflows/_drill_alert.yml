name: _drill-alert
# TEMPORARY dress-rehearsal artifact (2026-07-04). Fires ONE test message through the real
# src.telegram.send_alert path using the production secrets, then is deleted. Not part of the engine.
on:
  workflow_dispatch:

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: pip install requests
      - name: Fire one drill alert via src.telegram.send_alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c "from src.telegram import send_alert; print('telegram_ok:', send_alert('<b>DRILL - dress rehearsal 2026-07-04.</b> The V10 alert path works - this is a TEST via the real src.telegram.send_alert on GitHub Actions. Please ignore; reply once seen.'))"
