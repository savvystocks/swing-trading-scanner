name: oanda-fx-history
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Pull hourly bid/ask history (read-only)
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
        run: python3 scripts/oanda_fx_history.py
      - uses: actions/upload-artifact@v4
        with:
          name: fx_history
          path: fx_history/
          retention-days: 30
