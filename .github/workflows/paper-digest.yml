name: paper-digest

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 1-5"          # 21:30 UTC daily, Mon-Fri (clean post-market wrap)

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    concurrency:
      group: paper-digest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Mark paper positions + send digest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_paper_digest.py
      - name: Commit paper state
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "noreply@github.com"
          git add -f data/ambush_logs 2>/dev/null || true
          git add -f data/paper_trades/closed.json 2>/dev/null || true
          git add -f data/paper_trades/paper_probe_positions.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no paper state to commit"; exit 0; fi
          git commit -m "paper digest state [skip ci]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && break
            echo "push failed (concurrent commit) - rebasing onto latest main, attempt $i"
            git pull --rebase --autostash origin main || true
            sleep 2
          done
