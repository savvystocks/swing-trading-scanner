name: macro-review

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 5"           # 23:00 UTC Friday

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    concurrency:
      group: macro-review
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile macro + Bayesian state review
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          UNUSUAL_WHALES_TOKEN: ${{ secrets.UNUSUAL_WHALES_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_macro_review.py
      - name: Commit review log
        if: always()
        run: |
          git config user.name "macro-bot"
          git config user.email "noreply@github.com"
          git add -f data/ambush_logs 2>/dev/null || true
          if git diff --cached --quiet; then echo "no review log to commit"; exit 0; fi
          git commit -m "weekly macro review [skip ci]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && break
            echo "push failed (concurrent commit) - rebasing onto latest main, attempt $i"
            git pull --rebase --autostash origin main || true
            sleep 2
          done
