name: robinhood-fills

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run (parse + report, write nothing). Set to 0 to commit."
        required: false
        default: "1"
      seed:
        description: "Seed mode: mark all current fills as already-done, no backfill. 1 for first-time setup."
        required: false
        default: "0"
  schedule:
    # Every 30 min during US market hours - catches new fills so the monitor can watch them
    - cron: "*/30 13-20 * * 1-5"   # summer Mar-Oct
    - cron: "*/30 14-21 * * 1-5"   # winter Nov-Feb (overlap harmless)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: robinhood-fills
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sync fills
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DRY_RUN: ${{ github.event.inputs.dry || '0' }}
          SEED: ${{ github.event.inputs.seed || '0' }}
          RH_FILL_LOOKBACK_DAYS: ${{ github.event_name == 'schedule' && '5' || '90' }}
        run: python scripts/sync_robinhood_fills.py
      - name: Commit truth files
        if: github.event.inputs.dry != '1'
        run: |
          git config user.name "fills-bot"
          git config user.email "noreply@github.com"
          git add -f data/paper_trades/live_positions.json 2>/dev/null || true
          git add -f data/paper_trades/closed_positions.json 2>/dev/null || true
          git add -f data/paper_trades/processed_fills.json 2>/dev/null || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "fills: robinhood sync $(date -u +%H:%M) [skip ci]"
          git pull --rebase --autostash || true
          git push || true
