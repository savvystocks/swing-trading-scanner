name: health-check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 0"          # Sunday 12:00 UTC - weekly provider schema harness

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Provider schema harness
        env:
          UNUSUAL_WHALES_TOKEN: ${{ secrets.UNUSUAL_WHALES_TOKEN }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/schema_harness.py
      - name: Kill-switch channel canary
        env:
          SNAP_KEY: ${{ secrets.HARVEST_SNAPSHOTS_DEPLOY_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # The engine fail-opens when this key dies - /halt and /flatten would become
          # permanent no-ops with zero pages (coverage audit 2026-09-07). Red here = page.
          mkdir -p ~/.ssh && echo "$SNAP_KEY" > ~/.ssh/snap_key && chmod 600 ~/.ssh/snap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          if ! GIT_SSH_COMMAND="ssh -i ~/.ssh/snap_key -o IdentitiesOnly=yes" \
               git clone --depth 1 git@github.com:savvystocks/harvest-snapshots.git /tmp/snapcheck 2>/tmp/snap_err; then
            curl -fsS -m 10 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="KILL-SWITCH CANARY RED: the harvest-snapshots deploy key failed to clone - /halt and /flatten may be silent no-ops. $(head -c 200 /tmp/snap_err)" || true
            exit 1
          fi
          test -f /tmp/snapcheck/halt.json || echo "note: halt.json absent (never armed) - clone itself is the canary"
