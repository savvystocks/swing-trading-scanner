name: daily-email

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Scan date to load (YYYY-MM-DD). Leave blank for latest."
        required: false
        default: ""
  repository_dispatch:
    types: [run-daily-email]
  schedule:
    # Email lands 75 min after US market open = 45 min after the scan finishes.
    # Summer (BST/EDT, Mar-Nov): 15:45 BST = 14:45 UTC.
    # Winter (GMT/EST, Nov-Mar): 15:45 GMT = 15:45 UTC.
    - cron: "45 14 * 3-10 1-5"
    - cron: "45 15 * 1-2,11-12 1-5"

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check today's scan JSON exists (no auto-rescan to preserve quota)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ -f "data/results/catalyst_${TODAY}.json" ]; then
            echo "Found data/results/catalyst_${TODAY}.json — proceeding to email"
          else
            echo "::warning::No catalyst_${TODAY}.json — scan workflow must have failed. NOT auto-rescanning to preserve EODHD quota."
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "text=Daily email skipped on ${TODAY} — scan JSON missing. Check daily-scan workflow logs for failure." || true
            fi
            exit 0
          fi
      - name: Render and send catalyst emails (live Alpaca chain at send-time)
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CATALYST_DATE: ${{ inputs.target_date }}
          ACCOUNT_SIZE_USD: ${{ secrets.ACCOUNT_SIZE_USD }}
          POSITION_SIZE_PCT: "25"
          STOP_LOSS_PCT: ${{ secrets.STOP_LOSS_PCT }}
          MAX_CONCURRENT_LOTTERY: ${{ secrets.MAX_CONCURRENT_LOTTERY }}
          ACCOUNT_SIZE_GBP: "4000"
          MAX_CONCURRENT: "2"
          MAX_DRAWDOWN_PCT: "20"
          MAX_LOSS_STREAK: "3"
          GOAL_TARGET_GBP: "20000"
          GOAL_DEADLINE_ISO: "2026-11-29"
          BARCHART_API_KEY: ${{ secrets.BARCHART_API_KEY }}
          UNUSUAL_WHALES_TOKEN: ${{ secrets.UNUSUAL_WHALES_TOKEN }}
        run: python scripts/run_daily_email.py
      - name: Commit fresh scan + screen JSON
        if: always()
        run: |
          git config user.name "daily-email-bot"
          git config user.email "noreply@github.com"
          git add -f data/results/catalyst_*.json data/results/factor_screen_*.json data/catalyst/predictions/ data/catalyst/history.json data/catalyst/paper_trades.json data/universe/factor_universe_mcap_cache.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "email-bot: fresh scan + screen JSON [skip ci]"
          git push || true
      - name: Upload rendered HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-emails
          path: data/results/catalyst_*email*.html
