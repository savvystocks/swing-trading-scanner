name: midday-check

on:
  workflow_dispatch:
  schedule:
    # 14:00 UTC scheduled. With GitHub 4-6h delay, lands 18:00-20:00 UTC =
    # 19:00-21:00 user time = mid-to-late US session. Catches "missed the
    # bullet" stocks that already ran today.
    - cron: "0 14 * * 1-5"

permissions:
  actions: read
  contents: read

jobs:
  midday:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download latest scan artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: daily-scan.yml
          name: scan-result
          path: data/results/
          if_no_artifact_found: warn
      - name: Run mid-session check
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/run_midday_check.py
