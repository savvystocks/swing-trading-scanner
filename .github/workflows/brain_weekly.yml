name: brain-weekly

# V12 brain - the isolated analytical layer. Runs on GitHub's machines against a COPY of the nightly
# snapshot from the private harvest-snapshots repo. It NEVER touches the VPS, the live harvest.db, or
# the trading path. Sunday evening, after the week's last nightly snapshot; plus manual dispatch.
on:
  schedule:
    - cron: "0 22 * * 0"          # Sunday 22:00 UTC
  workflow_dispatch:
    inputs:
      drill_fail:
        description: "true = skip the real chain, fail a stub job to drill the failure alarm"
        required: false
        default: "false"

jobs:
  brain:
    if: ${{ github.event.inputs.drill_fail != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install brain deps
        run: pip install -r requirements-brain.txt
      - name: Fetch latest snapshot (read-only deploy key)
        env:
          SNAP_KEY: ${{ secrets.HARVEST_SNAPSHOTS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SNAP_KEY" > ~/.ssh/snap && chmod 600 ~/.ssh/snap
          GIT_SSH_COMMAND="ssh -i ~/.ssh/snap -o StrictHostKeyChecking=accept-new" \
            git clone --depth 1 git@github.com:savvystocks/harvest-snapshots.git snapshots
      - name: Run brain (Foundry -> Harness -> report)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.brain.run_weekly --snapshot snapshots --out brain_work --reports reports/v12_weekly --telegram
      - name: Commit weekly report
        if: always()
        run: |
          git config user.name "brain-bot"
          git config user.email "noreply@github.com"
          git add -f reports/v12_weekly/*.md 2>/dev/null || true
          if git diff --cached --quiet; then echo "no new brain report"; exit 0; fi
          git commit -m "v12 brain weekly report [skip ci]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && break
            git pull --rebase --autostash origin main || true
            sleep 2
          done

  # Part 4 of the discovery spec: the search re-runs with every Sunday brain cycle and appends to
  # reports/discovery/. Brain-side only - reads the snapshot COPY, writes reports, touches no live path.
  discovery:
    needs: brain
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install brain deps
        run: pip install -r requirements-brain.txt
      - name: Fetch latest snapshot (read-only deploy key)
        env:
          SNAP_KEY: ${{ secrets.HARVEST_SNAPSHOTS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SNAP_KEY" > ~/.ssh/snap && chmod 600 ~/.ssh/snap
          GIT_SSH_COMMAND="ssh -i ~/.ssh/snap -o StrictHostKeyChecking=accept-new" \
            git clone --depth 1 git@github.com:savvystocks/harvest-snapshots.git snapshots
      - name: Run discovery (Parts 1-5, everything counted)
        run: python -m src.brain.run_discovery --snapshot snapshots --out brain_work_discovery --reports reports/discovery
      - name: Commit discovery report + convergence state
        if: always()
        run: |
          git config user.name "brain-bot"
          git config user.email "noreply@github.com"
          git pull --rebase --autostash origin main || true
          git add -f reports/discovery/*.md reports/discovery/*.csv reports/discovery/convergence_state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no new discovery report"; exit 0; fi
          git commit -m "v12 discovery weekly report [skip ci]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && break
            git pull --rebase --autostash origin main || true
            sleep 2
          done

  # Stage 2 - the Student (ROADMAP item 8). PROVISIONAL below the 8k feature-bearing gate; the same
  # run at/above the gate is the official ignition. Reports only; the engine is never touched.
  student:
    needs: discovery
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install brain deps
        run: pip install -r requirements-brain.txt
      - name: Fetch latest snapshot (read-only deploy key)
        env:
          SNAP_KEY: ${{ secrets.HARVEST_SNAPSHOTS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SNAP_KEY" > ~/.ssh/snap && chmod 600 ~/.ssh/snap
          GIT_SSH_COMMAND="ssh -i ~/.ssh/snap -o StrictHostKeyChecking=accept-new" \
            git clone --depth 1 git@github.com:savvystocks/harvest-snapshots.git snapshots
      - name: Run the Student (train + acceptance gates + shadow)
        run: python -m src.brain.run_student --snapshot snapshots --out brain_work_student --reports reports/student
      - name: Commit student report
        if: always()
        run: |
          git config user.name "brain-bot"
          git config user.email "noreply@github.com"
          git pull --rebase --autostash origin main || true
          git add -f reports/student/*.md reports/student/*.json reports/student/*.csv 2>/dev/null || true
          if git diff --cached --quiet; then echo "no new student report"; exit 0; fi
          git commit -m "v12 student weekly report [skip ci]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && break
            git pull --rebase --autostash origin main || true
            sleep 2
          done

  # School Phase 2 - the Council (shadow). Five diverse members score OOF; recording only, no authority.
  council:
    needs: student
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install brain deps
        run: pip install -r requirements-brain.txt
      - name: Fetch latest snapshot (read-only deploy key)
        env:
          SNAP_KEY: ${{ secrets.HARVEST_SNAPSHOTS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SNAP_KEY" > ~/.ssh/snap && chmod 600 ~/.ssh/snap
          GIT_SSH_COMMAND="ssh -i ~/.ssh/snap -o StrictHostKeyChecking=accept-new" \
            git clone --depth 1 git@github.com:savvystocks/harvest-snapshots.git snapshots
      - name: Run Council + Treasurer/brakes (shadow) + Governor scoreboard
        run: |
          python -m src.brain.run_council --snapshot snapshots --out brain_work_council --reports reports/council
          python -m src.brain.run_treasurer --snapshot snapshots --out brain_work_treasurer --reports reports/treasurer || echo "treasurer skipped"
          python -m src.brain.run_governor --reports reports/governor --snapshot snapshots || echo "governor scoreboard skipped"
      - name: Commit council + treasurer + governor reports
        if: always()
        run: |
          git config user.name "brain-bot"
          git config user.email "noreply@github.com"
          git pull --rebase --autostash origin main || true
          git add -f reports/council/*.md reports/council/*.csv reports/treasurer/*.md reports/governor/*.md reports/strategy/strategy_this_week.md governor_registry.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no new council report"; exit 0; fi
          git commit -m "v12 council + treasurer + governor weekly report [skip ci]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && break
            git pull --rebase --autostash origin main || true
            sleep 2
          done

  drill:
    if: ${{ github.event.inputs.drill_fail == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Deliberate failure (alarm drill)
        run: |
          echo "DRILL: failing on purpose to exercise the Sunday-chain failure alarm"
          exit 1

  alarm:
    needs: [brain, discovery, student, council, drill]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Telegram alarm (same-day, not a buried email)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -fsS -m 15 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="SUNDAY BRAIN CHAIN FAILED: the weekly cycle (student/council/governor verdicts) did not complete - run ${{ github.run_id }}. No verdict will appear this week unless this is fixed and re-run." \
            || echo "telegram alert itself failed"
