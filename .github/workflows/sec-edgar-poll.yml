name: sec-edgar-poll

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-sec-edgar-poll]
  schedule:
    # Every hour during US market hours (13:00-20:00 UTC weekdays)
    # Reduced from 30min to hourly to stay under GitHub Actions free quota
    - cron: "0 13-20 * * 1-5"

permissions:
  contents: write
  actions: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Poll SEC EDGAR RSS
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_sec_edgar_poll.py
      - name: Commit seen-set
        if: always()
        run: |
          git config user.name "edgar-poll-bot"
          git config user.email "noreply@github.com"
          git add data/catalyst/edgar_rss_seen.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "edgar-poll: update seen set [skip ci]"
          git push || true
