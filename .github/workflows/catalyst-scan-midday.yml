name: catalyst-scan-midday

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-catalyst-scan-midday]
  # Schedule disabled - 90% Actions quota burn forced this off.
  # Re-enable after monthly quota reset (1st of month) or upgrade plan.
  # schedule:
  #   - cron: "30 19 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run mid-day catalyst scan + diff-vs-morning alert
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
          SKIP_EMAIL: "1"
          CATALYST_LLM_MAX: "10"
          ACCOUNT_SIZE_USD: ${{ secrets.ACCOUNT_SIZE_USD }}
          MIDDAY_SCAN: "1"
        run: python scripts/run_midday_scan.py
      - name: Commit fresh scan + alerts
        if: always()
        run: |
          git config user.name "midday-scan-bot"
          git config user.email "noreply@github.com"
          git add -f data/results/catalyst_*.json data/results/midday_diff_*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "midday-scan: fresh data + diff alerts [skip ci]"
          git push || true
