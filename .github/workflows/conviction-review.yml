name: conviction-review

on:
  workflow_dispatch:
  schedule:
    # Daily after US market close, Mon-Fri
    - cron: "30 20 * * 1-5"   # 20:30 UTC = ~30 min after close summer
    - cron: "30 21 * * 1-5"   # winter equivalent (overlap harmless)

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: conviction-review
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests anthropic
      - name: Resolve outcomes
        env:
          UNUSUAL_WHALES_TOKEN: ${{ secrets.UNUSUAL_WHALES_TOKEN }}
        run: python scripts/update_conviction_outcomes.py
      - name: Daily hyper-critical review
        env:
          UNUSUAL_WHALES_TOKEN: ${{ secrets.UNUSUAL_WHALES_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/daily_review.py
      - name: Commit log
        if: always()
        run: |
          git config user.name "review-bot"
          git config user.email "noreply@github.com"
          git add -f data/conviction_log.json data/reviews 2>/dev/null || true
          git diff --cached --quiet || git commit -m "conviction outcomes + daily review [skip ci]"
          git push || true
