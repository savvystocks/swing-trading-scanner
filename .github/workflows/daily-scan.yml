name: daily-scan

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Override target date (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""
      llm_max:
        description: "Max tickers to LLM-grade (default 50, set 0 to skip)"
        required: false
        default: ""
  repository_dispatch:
    types: [run-daily-scan]
  # Target: 30 min after US market open every weekday.
  # US market opens 14:30 BST (Mar-Nov, BST/EDT both in summer) -> scan 15:00 BST = 14:00 UTC.
  # US market opens 14:30 GMT (Nov-Mar, GMT/EST both in winter) -> scan 15:00 GMT = 15:00 UTC.
  # Two crons keep us on schedule across DST changes without manual flips.
  schedule:
    - cron: "0 14 * 3-10 1-5"
    - cron: "0 15 * 1-2,11-12 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run catalyst scan
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CATALYST_DATE: ${{ inputs.target_date }}
          CATALYST_LLM_MAX: ${{ inputs.llm_max }}
          SKIP_EMAIL: ${{ github.event_name == 'schedule' && '1' || '' }}
          ACCOUNT_SIZE_USD: ${{ secrets.ACCOUNT_SIZE_USD }}
          POSITION_SIZE_PCT: "25"
          STOP_LOSS_PCT: ${{ secrets.STOP_LOSS_PCT }}
          MAX_CONCURRENT_LOTTERY: ${{ secrets.MAX_CONCURRENT_LOTTERY }}
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
          ACCOUNT_SIZE_GBP: "4000"
          MAX_CONCURRENT: "2"
          MAX_DRAWDOWN_PCT: "20"
          MAX_LOSS_STREAK: "3"
          GOAL_TARGET_GBP: "20000"
          GOAL_DEADLINE_ISO: "2026-11-29"
          BARCHART_API_KEY: ${{ secrets.BARCHART_API_KEY }}
          UNUSUAL_WHALES_TOKEN: ${{ secrets.UNUSUAL_WHALES_TOKEN }}
        run: python scripts/run_daily_scan.py
      - name: Commit tracker data + scan JSON for email job
        if: always()
        run: |
          git config user.name "catalyst-tracker-bot"
          git config user.email "noreply@github.com"
          git add data/catalyst/predictions/ data/catalyst/history.json data/catalyst/paper_trades.json 2>/dev/null || true
          git add -f data/results/catalyst_*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "tracker: update predictions, history, paper trades, scan JSON, factor screen [skip ci]"
          git push || true
      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-result
          path: data/results/catalyst_*
