name: position-monitor

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-position-monitor]
  schedule:
    # Every 10 min during US market hours
    - cron: "*/10 13-20 * * 1-5"   # summer Mar-Oct
    - cron: "*/10 14-21 * * 1-5"   # winter Nov-Feb (overlap harmless)

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: position-monitor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run monitor
        env:
          UNUSUAL_WHALES_TOKEN: ${{ secrets.UNUSUAL_WHALES_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_position_monitor.py
      - name: Commit state
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "noreply@github.com"
          git add -f data/position_monitor_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "monitor state $(date -u +%H:%M) [skip ci]"
          git push || true
