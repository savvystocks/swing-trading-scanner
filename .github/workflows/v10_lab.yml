name: v10-lab

# V10 lab - the single production engine (V9 retired 2026-07-04). Runs on main directly.
# Paper-only: routes to the Alpaca paper API and commits the counterfactual-harvest
# transport (inbox jsonl + state) to main for the VPS poller to ingest.

on:
  schedule:
    - cron: "6,16,26,36,46,56 13-21 * * 1-5"   # 5-min offset from the :x0 dispatcher (2026-08-20: 1-min twin spacing caused queue churn -> completion gaps -> false crash alarms)   # hour 21 = winter (EST) last trading hour; summer 21:xx cycles no-op on the market-closed guard
                                   # FULL-CADENCE BACKUP (2026-08-06: cron-job.org went silent at 18:55
                                   # and the sparse backup couldn't carry the day -> dispatcher is now
                                   # REDUNDANT: GH schedule runs every 10 min at :x1 offsets, primary
                                   # repository_dispatch at :x0. Either alone sustains full cadence.
                                   # Overlap is harmless for the HARVEST
                                   # transport: the concurrency group serialises runs and
                                   # data/harvest_inbox/*.jsonl union-merges (.gitattributes, fa5bdc92).
                                   # KNOWN RESIDUAL: proactive_sandbox_logs.json is NOT union-merged, so
                                   # a rare double-push collision can still drop a TRADE RECORD -> the
                                   # cycle-start broker-vs-record reconciliation (ROADMAP item 2b) is the
                                   # real backstop for that. DO NOT remove this schedule as "redundant" -
                                   # it is the engine's only heartbeat if cron-job.org dies.
  workflow_dispatch:               # manual / API dispatch (needs ref + PAT with actions:write)
    inputs:
      flush:
        description: "true = flush all paper positions (clean-slate reset) instead of running a cycle"
        required: false
        default: "false"
  repository_dispatch:
    types: [run-sandbox]           # external cron: POST /repos/<owner>/<repo>/dispatches {"event_type":"run-sandbox"}

jobs:
  proactive-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    concurrency:
      group: v10-lab
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'             # 2026-08-19: dep install was ~2-4 min/cycle -> queue churn
                                   # (24 cancelled runs today ate the OVERNIGHT window)
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-sandbox.txt
      - name: Read owner halt flag (school 1e - snapshots repo, fail-open)
        env:
          SNAP_KEY: ${{ secrets.HARVEST_SNAPSHOTS_DEPLOY_KEY }}
        run: |
          echo "SCHOOL_HALT=0" >> "$GITHUB_ENV"
          echo "SCHOOL_FLATTEN=0" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh && printf '%s\n' "$SNAP_KEY" > ~/.ssh/snap && chmod 600 ~/.ssh/snap
          if GIT_SSH_COMMAND="ssh -i ~/.ssh/snap -o StrictHostKeyChecking=accept-new" \
             git clone -q --depth 1 git@github.com:savvystocks/harvest-snapshots.git /tmp/snapflag 2>/dev/null; then
            if [ -f /tmp/snapflag/halt.json ]; then
              H=$(python -c "import json;print(1 if json.load(open('/tmp/snapflag/halt.json')).get('halt') else 0)" 2>/dev/null || echo 0)
              F=$(python -c "import json;print(1 if json.load(open('/tmp/snapflag/halt.json')).get('flatten') else 0)" 2>/dev/null || echo 0)
              echo "SCHOOL_HALT=$H" >> "$GITHUB_ENV"
              echo "SCHOOL_FLATTEN=$F" >> "$GITHUB_ENV"
              echo "owner flag: halt=$H flatten=$F"
            fi
          else
            echo "flag fetch failed - fail-open (no halt)"
          fi
      - name: Execute Autonomous Proactive Lab
        env:
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          UNUSUAL_WHALES_TOKEN: ${{ secrets.UNUSUAL_WHALES_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROACTIVE_MOCK: "0"        # capture REAL macro/GEX/alt metadata, not mock
          PROACTIVE_FLUSH: ${{ github.event.inputs.flush }}   # 'true' on a flush dispatch, empty otherwise
        run: python sandbox_proactive_lab.py
      - name: Mark cycle complete (crash sentinel - the VPS watchdog reads this; 2026-08-17
              KeyError day proved crashed runs still push data, keeping the heartbeat fresh)
        if: success()
        run: |
          date -u +%FT%TZ > data/last_cycle_ok
          echo "$GITHUB_SHA" >> data/last_cycle_ok   # last-good CODE version - the watchdog rolls back to this
      - name: Persist forensic logs to main
        if: always()
        run: |
          git config user.name "sandbox-bot"
          git config user.email "noreply@github.com"
          git add -f proactive_sandbox_logs.json 2>/dev/null || true
          git add -f sandbox_ticker_cooloff.json 2>/dev/null || true
          git add -f sandbox_watchlist.json 2>/dev/null || true
          git add -f data/last_cycle_ok 2>/dev/null || true   # early-strength watch state (ephemeral runners forget it otherwise)
          git add -f v10_tuning_advisory.md proactive_autopsy_log.md v10_tunable_parameters.json 2>/dev/null || true
          git add -f data/harvest_inbox/*.jsonl data/harvest_state.json 2>/dev/null || true   # harvest transport -> VPS poller (main)
          git add -A data/FLUSH_PENDING 2>/dev/null || true   # commit the one-time-flush sentinel removal
          if git diff --cached --quiet; then echo "no new sandbox data"; exit 0; fi
          git commit -m "sandbox lab data [skip ci]"
          # JSON VALIDATION GATE (2026-08-24 incident: a rebase -X splice pushed syntactically
          # invalid JSON; the next run's 'unreadable=empty' fallback mass-adopted the whole
          # book). NEVER push an unparseable log - rebuild via the resolver or fail loudly.
          validate_log() {
            python -c "import json,sys; d=json.load(open('proactive_sandbox_logs.json')); sys.exit(0 if isinstance(d,list) else 1)"
          }
          for i in 1 2 3 4 5; do
            if ! validate_log; then
              echo "log INVALID before push (attempt $i) - rebuilding with resolver"
              python scripts/merge_logs.py || git checkout origin/main -- proactive_sandbox_logs.json
              validate_log || { echo "PERSIST ABORTED - could not produce valid JSON"; exit 1; }
              git add -f proactive_sandbox_logs.json
              git commit --amend --no-edit
            fi
            git push origin HEAD:main && break
            echo "push rejected - rebasing onto sandbox, attempt $i"
            if ! git pull --rebase --autostash origin main; then
              # record-level resolver (2026-08-12: the silent-loss bug that orphaned NVDA -
              # a conflicted rebase died here and the run's trade records vanished)
              if python scripts/merge_logs.py; then
                GIT_EDITOR=true git rebase --continue || true
              else
                git rebase --abort || true
                git pull --rebase -X theirs --autostash origin main || true
              fi
            fi
            sleep 2
          done
          validate_log || { echo "PERSIST ABORTED - final state invalid, NOT pushing"; exit 1; }
          git push origin HEAD:main || { echo "PERSIST FAILED - trade records NOT on main"; exit 1; }
